<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日兩字">
<meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<title>每日兩字</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#F3F6FA;--card:#FFFFFF;--ink:#101828;--mute:#5B667A;--line:#D9E0EA;--hl:#FFD84D;--hl-ink:#231A00;--act:#2447F9;--act-ink:#FFFFFF;--ok:#0E7A4B;--ok-bg:#DDF5E9;--no:#B42318;--no-bg:#FDE7E4;--bento:#E6ECF5;
--f-display:"Bricolage Grotesque","PingFang TC","Noto Sans TC",system-ui,sans-serif;--f-body:"Inter","PingFang TC","Noto Sans TC",system-ui,sans-serif;--f-hand:"Caveat","Bradley Hand",cursive}
@media (prefers-color-scheme:dark){:root{--bg:#0D1220;--card:#161D2E;--ink:#E9EDF5;--mute:#98A3B8;--line:#2A3348;--act:#8FA6FF;--act-ink:#0D1220;--ok:#6FD6A4;--ok-bg:#12372A;--no:#FF9C8F;--no-bg:#43201C;--bento:#1F283C;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--act);outline-offset:2px}
h1{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.kick{font-size:12px;letter-spacing:.06em;color:var(--mute);font-weight:500}
.hl{background:var(--hl);color:var(--hl-ink);border-radius:4px;padding:1px 5px;font-weight:600}
.term{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.1}
.ipa{color:var(--mute);font-size:14px}
.zh{font-size:18px;font-weight:600}
.def{color:var(--mute);font-size:14px}
.mn{border-left:3px solid var(--hl);padding-left:12px;font-size:15px}
.ex{font-size:15px}.ex span{display:block;color:var(--mute);font-size:14px}
.say{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.why{font-size:14px;color:var(--mute)}
.btn{border:0;background:var(--act);color:var(--act-ink);border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.ill{display:block;width:100%;height:auto}
.svgl{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink)}
.hand{font-family:var(--f-hand);font-size:30px;fill:var(--ink)}
@media (prefers-reduced-motion:reduce){.ill *{animation:none!important}.scene{animation:none!important}}
.stage{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;position:relative;
padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px));
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.head button,.nav button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;-webkit-user-select:none;user-select:none}
.scene{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow-y:auto;padding-block:12px;animation:in .35s ease-out;-webkit-user-select:text;user-select:text;cursor:default}
@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.scene h1{font-size:38px}
.scene .news{font-size:19px;line-height:1.6}
.scene .cap{font-size:17px}
.pic{background:var(--card);border-radius:18px;padding:12px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tip{text-align:center;font-size:13px;color:var(--mute);min-width:0}
.src{font-size:13px;color:var(--mute)}.src a{color:var(--act)}
.fin{font-family:var(--f-display);font-size:30px;font-weight:700}
</style>
<style id="daycss"></style>
</head>
<body>
<div class="stage">
  <div class="bars" id="bars"></div>
  <div class="head"><span class="kick" id="meta">每日兩字</span><button id="pause" aria-pressed="false">暫停</button></div>
  <div class="scene" id="scene" aria-live="polite"><p class="cap">正在載入今天的內容…</p></div>
  <div class="nav"><button id="zl">上一幕</button><span class="tip" id="tip"></span><button id="zr">下一幕</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const canSay=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function say(t){if(!canSay)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
let DAY,S=[],fills=[],cur=0,start=0,acc=0,paused=false,solved={},autoP=false,hadSel=false,T0=Date.now(),ready=false;
function elapsed(){const s=Math.round((Date.now()-T0)/1000);return (s>=60?Math.floor(s/60)+' 分 ':'')+(s%60)+' 秒'}
function para(i){return esc(DAY.p[i]).replace(/\{(\d)\}/,(m,n)=>`<span class="hl">${esc(DAY.inText[n])}</span>`)}
function wordBody(w){return `<div class="kick">${esc(w.pos)}</div><div class="term">${esc(w.term)}</div><div class="ipa">${esc(w.ipa)}</div><div class="zh">${esc(w.zh)}</div><div class="def">${esc(w.def)}</div><p class="mn">${esc(w.mn)}</p><p class="ex">${esc(w.ex)}<span>${esc(w.exZh)}</span></p>${canSay?`<div><button class="say" data-say="${esc(w.term)}. ${esc(w.ex)}">聽發音與例句</button></div>`:''}`}
function quizHTML(i){const q=DAY.quiz[i];return `<div class="kick">第 ${i+1} 題，共 ${DAY.quiz.length} 題</div><p style="font-size:17px;font-weight:500">${esc(q.q)}</p><div style="display:grid;gap:8px" data-quiz="${i}">${q.opts.map((o,j)=>`<button class="opt" data-o="${j}">${esc(o)}</button>`).join('')}</div><p class="why" data-why="${i}" hidden>${esc(q.why)}</p>`}
function build(){const W=DAY.words;
const word=i=>({t:11,h:()=>`<div class="pic">${W[i].ill}</div>${wordBody(W[i])}`});
S=[
{t:6,h:()=>`<span class="kick">${esc(DAY.topic)} · 今日 ${W.length} 個新字</span><h1>${esc(DAY.title)}</h1><div class="pic">${W[0].ill}</div><p class="cap">${esc(DAY.hook)}</p>`},
{t:14,h:()=>`<span class="kick">新聞 1/2</span><p class="news">${para(0)}</p>`},
word(0),
{t:6,h:()=>`<div class="pic">${W[1].ill}</div><p class="cap">${esc(DAY.bridge)}</p>`},
{t:14,h:()=>`<span class="kick">新聞 2/2</span><p class="news">${para(1)}</p><div class="src">依據報導改寫：<a href="${esc(DAY.src.url)}" target="_blank" rel="noopener">${esc(DAY.src.name)}</a></div>`},
word(1),
...DAY.quiz.map((q,i)=>({t:0,quiz:true,h:()=>quizHTML(i)})),
{t:0,h:()=>`<div class="fin">今日完成</div><p class="cap">用時 ${elapsed()}。</p><p class="def">${W.map(w=>esc(w.term)+'：'+esc(w.zh)).join('<br>')}</p><div><button class="btn" id="again">再看一次</button></div>`}];
$('bars').innerHTML=S.map(()=>'<i><b></b></i>').join('');fills=[...document.querySelectorAll('.bars b')]}
function show(i){cur=Math.max(0,Math.min(S.length-1,i));const sc=$('scene');sc.innerHTML=S[cur].h();sc.scrollTop=0;
sc.style.animation='none';void sc.offsetWidth;sc.style.animation='';
fills.forEach((b,j)=>b.style.width=j<cur?'100%':'0');acc=0;start=performance.now();
const q=S[cur].quiz;$('tip').textContent=cur===S.length-1?'':q&&!solved[cur]?'選一個答案':'長按文字可選取翻譯';
if(q&&solved[cur])mark()}
function mark(){const box=document.querySelector('[data-quiz]');if(!box)return;const i=+box.dataset.quiz;box.dataset.done=1;box.children[DAY.quiz[i].a].classList.add('ok');document.querySelector(`[data-why="${i}"]`).hidden=false}
function answer(btn){const box=btn.parentElement,i=+box.dataset.quiz,q=DAY.quiz[i];if(box.dataset.done)return;if(+btn.dataset.o===q.a){solved[cur]=1;mark();$('tip').textContent='答對了，點下一幕'}else btn.classList.add('no')}
function tick(now){if(ready){const s=S[cur];if(s.t>0){const el=acc+(paused?0:now-start);const p=Math.min(1,el/(s.t*1000));fills[cur].style.width=(p*100)+'%';if(p>=1)show(cur+1)}else{fills[cur].style.width=solved[cur]||cur===S.length-1?'100%':'0'}}requestAnimationFrame(tick)}
function next(){if(!ready)return;if(S[cur].quiz&&!solved[cur])return;if(cur<S.length-1)show(cur+1)}
function prev(){if(ready)show(cur-1)}
function togglePause(){const now=performance.now();if(paused){start=now}else{acc+=now-start}paused=!paused;$('pause').textContent=paused?'繼續':'暫停';$('pause').setAttribute('aria-pressed',paused)}
const hasSel=()=>{const s=window.getSelection();return !!s&&!s.isCollapsed&&s.toString().trim()!==''};
$('zr').onclick=next;$('zl').onclick=prev;
$('pause').onclick=()=>{autoP=false;togglePause()};
document.addEventListener('selectionchange',()=>{const h=hasSel();if(h&&!paused){autoP=true;togglePause()}else if(!h&&paused&&autoP){autoP=false;togglePause()}});
$('scene').addEventListener('pointerdown',()=>{hadSel=hasSel()},true);
$('scene').addEventListener('click',e=>{if(!ready)return;const t=e.target.closest('button');
if(!t){if(e.target.closest('a')||hadSel||hasSel())return;const r=$('scene').getBoundingClientRect();if(e.clientX-r.left<r.width*.28)prev();else next();return}
if(t.dataset.say){say(t.dataset.say);if(!paused){autoP=false;togglePause()}}
else if(t.dataset.o!==undefined){answer(t)}
else if(t.id==='again'){solved={};T0=Date.now();show(0)}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
async function getJSON(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' '+r.status);return r.json()}
async function boot(){try{
const asked=new URLSearchParams(location.search).get('d');
const date=/^\d{4}-\d{2}-\d{2}$/.test(asked||'')?asked:(await getJSON('latest.json')).date;
DAY=await getJSON('days/'+date+'.json');
const [y,m,d]=DAY.date.split('-').map(Number);$('meta').textContent=m+' 月 '+d+' 日 · 每日兩字';
$('daycss').textContent=DAY.css||'';build();ready=true;T0=Date.now();show(0)
}catch(e){$('scene').innerHTML='<p class="cap">今天的內容載入失敗。請確認網路後重新整理。</p>'}}
boot();requestAnimationFrame(tick);
</script>
</body>
</html>
